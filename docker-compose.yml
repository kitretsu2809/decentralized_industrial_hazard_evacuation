version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: lbp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  environment:
    build:
      context: .
      dockerfile: sim/services/environment/Dockerfile
    container_name: lbp-environment
    volumes:
      - ./core:/app/core:ro
      - ./sim/services/environment/src:/app/sim/services/environment/src
      - ./sim/hal_impl:/app/hal_impl:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL}
      - SIM_STATE_FPS=3
      - SIM_SPEED=${SIM_SPEED}
      - PYTHONPATH=/app
    restart: unless-stopped

  perception:
    build:
      context: .
      dockerfile: sim/services/perception/Dockerfile
    container_name: lbp-perception
    volumes:
      - ./core:/app/core:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL}
      - PYTHONPATH=/app
    restart: unless-stopped

  policy:
    build:
      context: .
      dockerfile: sim/services/policy/Dockerfile
    container_name: lbp-policy
    volumes:
      - ./core:/app/core:ro
      - ./sim/services/policy/src:/app/sim/services/policy/src
      - ./data/models:/app/models:ro
    depends_on:
      redis:
        condition: service_healthy
      environment:
        condition: service_started
    environment:
      - REDIS_URL=${REDIS_URL}
      - PYTHONPATH=/app
    restart: unless-stopped

  gui:
    build:
      context: .
      dockerfile: sim/services/gui/Dockerfile
    container_name: lbp-gui
    ports:
      - "${GUI_PORT:-8080}:8080"
    volumes:
      - ./core:/app/core:ro
      - ./sim/services/gui/src:/app/sim/services/gui/src
      - ./sim/services/gui/static:/app/sim/services/gui/static

    depends_on:
      redis:
        condition: service_healthy
      environment:
        condition: service_started
    environment:
      - REDIS_URL=${REDIS_URL}
      - PYTHONPATH=/app
    restart: unless-stopped
